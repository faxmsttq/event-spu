<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดการระบบ · SPU Event</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="events.html"><i class="icon icon-24 i-cal"></i>SPU EVENT</a>
    <nav class="nav">
      <a href="events.html"><i class="icon icon-18 i-house"></i>กิจกรรม</a>
      <a href="saved.html"><i class="icon icon-18 i-heart"></i>บันทึกไว้</a>
      <a href="mine.html"><i class="icon icon-18 i-clip"></i>ของฉัน</a>
      <a href="notifications.html"><i class="icon icon-18 i-bell"></i>แจ้งเตือน</a>
      <a href="profile.html" class="on"><i class="icon icon-18 i-user"></i>โปรไฟล์</a>
    </nav>
    <div class="top-actions">
      <a class="btn outline sm create-btn" href="requests.html"><i class="icon icon-18 i-plus"></i><span>สร้างกิจกรรม</span></a>
      <a class="avatar" id="avatar" href="profile.html"></a>
    </div>
  </div>
</header>

<main class="page">
  <div class="container narrow rise">
    <div class="page-head">
      <div>
        <h1>จัดการระบบ</h1>
        <p class="muted">สำหรับผู้ดูแลระบบ: พิจารณาคำขอแทนคณบดี จัดการกิจกรรม และประกาศหน้าหลัก</p>
      </div>
    </div>

    <!-- ตัวเลขสรุปภาพรวมระบบ -->
    <div class="stat-grid" id="stats"></div>

    <div class="seg" id="tabs">
      <button data-tab="requests" class="on">คำขอจัดกิจกรรม</button>
      <button data-tab="pending">รออนุมัติโพสต์ <b class="count" id="pendingCount"></b></button>
      <button data-tab="events">กิจกรรม</button>
      <button data-tab="users">ผู้ใช้</button>
      <button data-tab="news">ประกาศ</button>
    </div>

    <!-- กิจกรรมที่นักศึกษาสร้างแล้ว รอแอดมินอนุมัติก่อนโชว์ให้ทุกคนเห็น -->
    <section id="pendingTab" hidden>
      <div class="stack rise" id="pendingList"></div>
    </section>

    <!-- แท็บ: กิจกรรมทั้งหมด -->
    <section id="eventsTab" hidden>
      <div class="stack rise" id="eventList"></div>
    </section>

    <!-- แท็บ 1: คำขอจัดกิจกรรม -->
    <section id="requestsTab">
      <div class="stack rise" id="requestList"></div>
    </section>

    <!-- แท็บ 2: ประกาศ / ประชาสัมพันธ์ -->
    <!-- แท็บ: ผู้ใช้ (นักศึกษาแก้รหัส คณะ ชั้นปีเองไม่ได้ ต้องให้แอดมินแก้ตรงนี้) -->
    <section id="usersTab" hidden>
      <label class="search" style="margin-bottom: 16px">
        <i class="icon i-search"></i>
        <input id="userSearch" type="search" placeholder="ค้นหาชื่อ อีเมล หรือรหัสนักศึกษา">
      </label>
      <div class="stack rise" id="userList"></div>
    </section>

    <section id="newsTab" hidden>
      <form class="box stack" id="newsForm" novalidate>
        <h3>เพิ่มประกาศ / ประชาสัมพันธ์</h3>
        <p class="form-err" role="alert" hidden></p>
        <div class="two">
          <label class="field">
            <span>ประเภท</span>
            <select name="tag">
              <option>ประกาศ</option>
              <option>ประชาสัมพันธ์</option>
              <option>ข่าวระบบ</option>
            </select>
          </label>
          <label class="field">
            <span>สีโปสเตอร์</span>
            <select name="color">
              <option value="c-aca">ชมพู</option>
              <option value="c-fun">ส้ม</option>
              <option value="c-sport">ฟ้า</option>
              <option value="c-vol">เขียว</option>
            </select>
          </label>
        </div>
        <label class="field"><span>หัวข้อ</span><input name="title" type="text" maxlength="60"></label>
        <label class="field"><span>ข้อความสั้น (แสดงบนการ์ด)</span><input name="text" type="text" maxlength="100"></label>
        <label class="field"><span>รายละเอียด (แสดงในหน้าดูรายละเอียด)</span><textarea name="detail" rows="5" maxlength="2000"></textarea></label>
        <label class="field">
          <span>ไฟล์โปสเตอร์ (ถ้ามี)</span>
          <input name="image" type="file" accept="image/*">
          <small class="muted">แนะนำรูปแนวนอน 16:9 เช่น 1200 × 675 พิกเซล (JPG / PNG) รูปจะถูกย่อให้เล็กลงอัตโนมัติ</small>
        </label>
        <img class="img-preview" id="imgPreview" alt="ตัวอย่างโปสเตอร์" hidden>
        <label class="field"><span>ลิงก์ที่เกี่ยวข้อง (ถ้ามี)</span><input name="link" type="text" placeholder="เช่น event.html?id=e2 หรือ https://..."></label>
        <button class="btn primary block"><i class="icon icon-18 i-megaphone"></i>เพิ่มประกาศ</button>
      </form>

      <h2 class="sub">ประกาศที่แสดงอยู่</h2>
      <div class="grid" id="newsList"></div>
    </section>
  </div>
</main>

<nav class="tabbar">
  <a href="events.html"><i class="icon i-house"></i>กิจกรรม</a>
  <a href="saved.html"><i class="icon i-heart"></i>บันทึกไว้</a>
  <a href="mine.html"><i class="icon i-clip"></i>ของฉัน</a>
  <a href="notifications.html"><i class="icon i-bell"></i>แจ้งเตือน</a>
  <a href="profile.html" class="on"><i class="icon i-user"></i>โปรไฟล์</a>
</nav>

<div id="toast"></div>
<script src="js/common.js"></script>
<script>
  requireAdmin();

  /* ---------- แท็บ ---------- */
  document.querySelectorAll("#tabs button").forEach(function (button) {
    button.addEventListener("click", function () {
      document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b === button));
      // แสดงเฉพาะ section ที่ชื่อตรงกับแท็บ เช่น data-tab="events" → id="eventsTab"
      ["requests", "pending", "events", "users", "news"].forEach(name => {
        document.getElementById(name + "Tab").hidden = button.dataset.tab !== name;
      });
    });
  });

  /* ---------- ตัวเลขสรุป ---------- */
  function showStats() {
    const waiting = getRequests().filter(r => r.status === "sending" || r.status === "processing").length;
    const pending = getEvents().filter(e => e.status === "pending").length;
    const students = getUsers().filter(u => !isAdmin(u) && !isStaff(u)).length; // นับเฉพาะนักศึกษา ไม่นับอาจารย์ / เจ้าหน้าที่
    const seats = getEvents().reduce((sum, e) => sum + e.joined, 0);
    const stats = [[waiting, "คำขอรอพิจารณา"], [pending, "กิจกรรมรออนุมัติ"], [students, "นักศึกษาในระบบ"], [seats, "ที่นั่งที่ถูกจองแล้ว"]];
    document.getElementById("stats").innerHTML = stats.map(s => `<div class="box"><b>${s[0].toLocaleString()}</b><small>${s[1]}</small></div>`).join("");
  }

  /* ---------- กิจกรรมทั้งหมด ---------- */
  function showEventList() {
    const events = sortByDate(getEvents()).reverse(); // ใหม่ล่าสุดก่อน
    document.getElementById("eventList").innerHTML = events.map(e => `
      <div class="box row-item">
        <div>
          <h3><a class="link" href="event.html?id=${e.id}">${safe(e.title)}</a></h3>
          <small class="muted">${eventTime(e)} · ${safe(e.organizer)} · เข้าร่วม ${e.joined}/${e.cap}</small>
        </div>
        <div class="row-acts">
          ${badgeHTML(e)}
          ${isPast(e) || !isPublished(e) ? "" : `<button class="btn ghost sm" onclick="toggleEvent('${e.id}')">${e.status === "open" ? "ปิดรับสมัคร" : "เปิดรับสมัคร"}</button>`}
          <button class="btn danger-outline sm" onclick="removeEvent('${e.id}')">ลบ</button>
        </div>
      </div>`).join("") || '<div class="empty box sm"><p class="muted">ยังไม่มีกิจกรรม</p></div>';
  }

  /* ---------- กิจกรรมรออนุมัติโพสต์ ---------- */
  function showPending() {
    const events = getEvents().filter(e => e.status === "pending");
    document.getElementById("pendingCount").textContent = events.length || "";
    document.getElementById("pendingList").innerHTML = events.map(function (e) {
      const owner = getUsers().find(u => u.email === e.createdBy);
      return `
        <article class="box req">
          <div class="req-head">
            <div>
              <h3><a class="link" href="event.html?id=${e.id}">${safe(e.title)}</a></h3>
              <small class="muted">โพสต์โดย ${safe(owner ? owner.first + " " + owner.last : e.createdBy)}</small>
            </div>
            ${badgeHTML(e)}
          </div>
          ${e.image ? `<img class="img-preview" style="margin-top: 12px" src="${safe(e.image)}" alt="โปสเตอร์">` : ""}
          <p class="muted" style="margin-top: 10px">${safe(e.desc)}</p>
          <dl class="info-list">
            <div><dt>วันเวลา</dt><dd>${eventTime(e)}</dd></div>
            <div><dt>สถานที่</dt><dd>${safe(e.place)}</dd></div>
            <div><dt>เจ้าภาพที่จัด</dt><dd>${safe(e.organizer)}</dd></div>
            <div><dt>จำนวนที่รับ</dt><dd>${e.cap} คน</dd></div>
            <div><dt>ใครลงทะเบียนได้</dt><dd>${safe(facultyText(e))}</dd></div>
            <div><dt>แบบฟอร์มสมัคร</dt><dd>${safe(e.formLink) || "-"}</dd></div>
          </dl>
          <div class="req-acts">
            <button class="btn primary" onclick="approveEvent('${e.id}')">อนุมัติโพสต์</button>
            <button class="btn danger-outline" onclick="rejectEvent('${e.id}')">ไม่อนุมัติ</button>
          </div>
        </article>`;
    }).join("") || '<div class="empty box sm"><p class="muted">ไม่มีกิจกรรมรออนุมัติ</p></div>';
  }

  function approveEvent(id) {
    const event = getEventById(id);
    event.status = "open";
    event.rejectNote = "";
    updateEvent(event);
    showToast("อนุมัติแล้ว กิจกรรมเปิดรับสมัครแล้ว");
    refresh();
  }

  function rejectEvent(id) {
    const reason = prompt("เหตุผลที่ไม่อนุมัติ (ผู้ยื่นจะเห็นข้อความนี้)");
    if (reason === null || reason.trim() === "") return;
    const event = getEventById(id);
    event.status = "rejected";
    event.rejectNote = reason.trim();
    updateEvent(event);
    showToast("ไม่อนุมัติกิจกรรมนี้แล้ว");
    refresh();
  }

  function refresh() {
    showStats();
    showPending();
    showEventList();
  }

  function toggleEvent(id) {
    const event = getEventById(id);
    event.status = event.status === "open" ? "closed" : "open";
    updateEvent(event);
    showToast(event.status === "open" ? "เปิดรับสมัครแล้ว" : "ปิดรับสมัครแล้ว");
    showEventList();
  }

  function removeEvent(id) {
    if (!confirm("ลบกิจกรรม \"" + getEventById(id).title + "\" ใช่ไหม?")) return;
    deleteEvent(id);
    showToast("ลบกิจกรรมแล้ว");
    refresh();
  }

  /* ---------- คำขอจัดกิจกรรม ---------- */

  // แอดมินเห็นคำขอทุกคณะ (การ์ดกับปุ่มอนุมัติอยู่ใน common.js ใช้ร่วมกับหน้าอาจารย์)
  function showRequests() {
    document.getElementById("requestList").innerHTML =
      sortForReview(getRequests()).map(reviewCardHTML).join("") || '<div class="empty box sm"><p class="muted">ยังไม่มีคำขอ</p></div>';
  }

  // ปุ่มในการ์ดคำขอเรียกฟังก์ชันนี้
  function setStatus(id, status) {
    if (!reviewRequest(id, status)) return;
    showStats();
    showRequests();
  }

  /* ---------- ประกาศ ---------- */

  function showNews() {
    document.getElementById("newsList").innerHTML = getNews().map(n =>
      `<div class="card-wrap">${newsCardHTML(n)}<button class="btn danger-outline sm" onclick="deleteNews('${n.id}')">ลบประกาศนี้</button></div>`
    ).join("") || '<p class="muted">ยังไม่มีประกาศ</p>';
  }

  function deleteNews(id) {
    if (!confirm("ลบประกาศนี้ใช่ไหม?")) return;
    saveNews(getNews().filter(n => n.id !== id));
    showToast("ลบประกาศแล้ว");
    showNews();
  }

  /* ---------- ผู้ใช้ ---------- */
  const YEARS = ["ปี 1", "ปี 2", "ปี 3", "ปี 4", "ปี 5 ขึ้นไป"];

  function optionsHTML(list, selected) {
    // ค่าเดิมไม่อยู่ในรายการ (เช่น ชื่อคณะเก่า) ก็ใส่ไว้ด้วย ข้อมูลจะได้ไม่หาย
    if (selected && !list.includes(selected)) list = [selected, ...list];
    return list.map(v => `<option value="${safe(v)}"${v === selected ? " selected" : ""}>${safe(v)}</option>`).join("");
  }

  function showUsers() {
    const keyword = document.getElementById("userSearch").value.trim().toLowerCase();
    const users = getUsers()
      .filter(u => !isAdmin(u))
      .filter(u => (u.first + " " + u.last + " " + u.email + " " + u.studentId).toLowerCase().includes(keyword));

    document.getElementById("userList").innerHTML = users.map(function (u) {
      const student = !isStaff(u);
      return `
        <form class="box row-item" data-email="${safe(u.email)}">
          <div>
            <h3>${safe(u.first + " " + u.last)}</h3>
            <small class="muted">${safe(u.email)} · ${student ? "นักศึกษา" : safe(u.position)}</small>
          </div>
          <div class="row-acts">
            ${student ? `<input class="mini" name="studentId" value="${safe(u.studentId)}" maxlength="8" inputmode="numeric" aria-label="รหัสนักศึกษา">` : ""}
            <select class="mini" name="faculty" aria-label="คณะ">${optionsHTML(FACULTIES, u.faculty)}</select>
            ${student ? `<select class="mini" name="year" aria-label="ชั้นปี">${optionsHTML(YEARS, u.year)}</select>` : ""}
            <button class="btn primary sm">บันทึก</button>
          </div>
        </form>`;
    }).join("") || '<div class="empty box sm"><p class="muted">ไม่พบผู้ใช้</p></div>';
  }

  // กดบันทึกในแถวไหนก็ได้ (ฟอร์มถูกสร้างใหม่ทุกครั้ง เลยดักที่กล่องรายการแทน)
  document.getElementById("userList").addEventListener("submit", function (e) {
    e.preventDefault();
    const row = e.target;
    const users = getUsers();
    const user = users.find(u => u.email === row.dataset.email);

    if (row.elements.studentId) {
      const studentId = row.elements.studentId.value.trim();
      if (!/^\d{8}$/.test(studentId)) {
        showToast("รหัสนักศึกษาต้องเป็นตัวเลข 8 หลัก");
        return;
      }
      // รหัสนักศึกษาห้ามซ้ำกับคนอื่น
      if (users.some(u => u !== user && u.studentId === studentId)) {
        showToast("รหัสนักศึกษานี้มีคนใช้แล้ว");
        return;
      }
      user.studentId = studentId;
      user.year = row.elements.year.value;
    }
    user.faculty = row.elements.faculty.value;
    saveUsers(users);
    showToast("บันทึกข้อมูลของ " + user.first + " แล้ว");
  });

  document.getElementById("userSearch").addEventListener("input", showUsers);
  showUsers();

  const newsForm = document.getElementById("newsForm");
  const imgPreview = document.getElementById("imgPreview");
  let posterImage = ""; // รูปโปสเตอร์ที่แปลงเป็นข้อความ (data URL) เพื่อเก็บใน localStorage ได้

  newsForm.elements.image.addEventListener("change", function () {
    posterImage = "";
    imgPreview.hidden = true;
    if (!this.files[0]) return;
    resizeImage(this.files[0], 1000, function (dataUrl) {
      posterImage = dataUrl;
      imgPreview.src = dataUrl;
      imgPreview.hidden = false;
    });
  });

  newsForm.addEventListener("submit", function (e) {
    e.preventDefault();
    const f = newsForm.elements;
    if (f.title.value.trim() === "" || f.text.value.trim() === "") {
      showFormError(newsForm, "กรุณากรอกหัวข้อและข้อความสั้น");
      return;
    }
    const link = f.link.value.trim();
    if (link !== "" && !isSafeLink(link)) {
      showFormError(newsForm, "ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https:// หรือเป็นหน้าในเว็บ เช่น event.html?id=e2");
      return;
    }

    const news = getNews();
    news.unshift({
      id: "n" + Date.now(),
      tag: f.tag.value,
      color: f.color.value,
      title: f.title.value.trim(),
      text: f.text.value.trim(),
      detail: f.detail.value.trim(),
      image: posterImage,
      link: link
    });

    // ถ้าพื้นที่ localStorage เต็ม (รูปใหญ่/เยอะเกินไป) จะบันทึกไม่ได้
    try {
      saveNews(news);
    } catch (error) {
      showFormError(newsForm, "พื้นที่เก็บข้อมูลเต็ม ลองใช้รูปที่เล็กลง หรือลบประกาศเก่าก่อน");
      return;
    }

    newsForm.reset();
    posterImage = "";
    imgPreview.hidden = true;
    showToast("เพิ่มประกาศแล้ว ไปดูได้ที่หน้ากิจกรรม");
    showNews();
  });
  newsForm.addEventListener("input", () => hideFormError(newsForm));

  showStats();
  showRequests();
  showPending();
  showEventList();
  showNews();
</script>
<script src="js/lang.js"></script>
</body>
</html>
